name: Feature request
description: Suggest something the skill should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task you are trying to get done in OpenClaw with LeadJourney.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
